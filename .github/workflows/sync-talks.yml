name: Sync talks from Google Calendar

# Google Calendar is the source of truth for any talk starting soon (see
# scripts/import_calendar_talks.py for the window and the description format
# it expects). This runs the sync hourly during working hours, commits
# whatever changed straight to master, and then starts the deploy so the site
# republishes right away.
#
# Nothing here ever writes back to Google Calendar.

on:
  schedule:
    # Hourly, every day. Minute 7 avoids the top-of-the-hour queue, when
    # GitHub delays or drops scheduled runs.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      window_days:
        description: "How many days ahead the calendar owns"
        default: "90"
      dry_run:
        description: "Preview only -- do not commit, push, or deploy"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # start pages.yml after pushing

concurrency:
  group: sync-talks
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # sync commit gets no CI of its own -- validate here instead, before
      # anything is written.
      - name: Run the calendar-parsing tests
        run: python3 scripts/test_calendar_parsing.py

      - name: Sync talk records from the calendar
        id: sync
        run: |
          set -o pipefail
          ARGS="--sync --window-days ${{ github.event.inputs.window_days || '90' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          # ARGS deliberately holds multiple space-separated flags, so it is
          # meant to word-split here.
          # shellcheck disable=SC2086
          python3 scripts/import_calendar_talks.py $ARGS 2>&1 | tee /tmp/sync-report.txt
          # a random delimiter, since the report can contain calendar-supplied
          # text (talk titles, etc.) that in principle could collide with a
          # fixed one
          delimiter="SYNC_REPORT_$(openssl rand -hex 8)"
          {
            echo "report<<$delimiter"
            cat /tmp/sync-report.txt
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Fill in tags for any new record
        if: github.event.inputs.dry_run != 'true'
        run: python3 scripts/tag_talks.py

      - name: Regenerate talk pages, talks.ics, and talks.json
        if: github.event.inputs.dry_run != 'true'
        run: |
          python3 scripts/generate_talks.py
          python3 scripts/generate_talks.py --check

      - name: Commit and push to master
        id: push
        if: github.event.inputs.dry_run != 'true'
        env:
          REPORT: ${{ steps.sync.outputs.report }}
        run: |
          git add -A _data/talks _talks talks.ics talks.json
          if git diff --cached --quiet; then
            echo "The calendar and the repo already agree; nothing to push."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'Sync talks from Google Calendar\n\n%s\n' "$REPORT" > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          # master may have moved since checkout; rebase onto it and retry a
          # few times rather than fail on a race with another push
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto the latest master."
            git pull --rebase origin master
          done
          echo "::error::Could not push the sync commit to master."
          exit 1

      # The push above, made with GITHUB_TOKEN, does not trigger pages.yml on
      # its own, so start the deploy explicitly. As a workflow_dispatch run it
      # builds the tip of master and skips the manual-edit guard, which is
      # meant for human edits, not the sync's.
      - name: Deploy the site
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref master
