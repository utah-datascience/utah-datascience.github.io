name: Deploy site

# Builds and publishes the site via GitHub Pages' "GitHub Actions" deployment
# source, rather than the classic "deploy from a branch" build. That is what
# lets `deploy` require other checks (see needs:) before the site republishes.
#
# Rollout: this workflow builds and uploads harmlessly even while Pages is
# still configured for the legacy branch build -- deploy-pages only takes
# effect once Settings > Pages > Source is switched to "GitHub Actions".

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
