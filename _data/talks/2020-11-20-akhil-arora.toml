bio = "Akhil Arora is a PhD student affiliated with the Data Science Lab (dlab) at EPFL. Prior to this, Akhil spent close to five years in industry working with the research labs of American Express and Xerox. Akhil’s research interests include large scale data management, graph mining, and machine learning. He is a recipient of the prestigious “EDIC Doctoral Fellowship” for the academic year 2018-19, and the “Most Reproducible Paper” award at SIGMOD 2018. He has published his research in prestigious data mining and database conferences, served as a reviewer, and co-organized workshops in these conferences."

