abstract = "The institution of authorship is what enables research in pure mathematics to be commodified. In this talk, we argue that the mere existence of advanced AI tools undermines this role of authorship and that this issue cannot be dodged by simply refusing to use AI. So, what happens if we accept the use of AI tools? As a thought experiment, we consider the extreme case in which AI technology becomes powerful enough to render authorship mostly irrelevant. In a more realistic scenario, we discuss the fate of professional research if the prestige typically associated with authoring original work is diminished."

