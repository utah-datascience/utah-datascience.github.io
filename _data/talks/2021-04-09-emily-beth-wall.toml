bio = "Dr. Emily Wall is an Assistant Professor in the Computer Science department at Emory University (beginning Summer 2021). She completed her PhD in the School of Interactive Computing at Georgia Tech in 2020 and is currently a Postdoctoral Scholar at Northwestern University. Her research interests lie at the intersection of cognitive science and data visualization. Particularly, her research has focused on increasing awareness of unconscious and implicit human biases through the design and evaluation of (1) computational approaches to quantify bias from user interaction and (2) interfaces to support visual data analysis. Her research has been supported by NSF, Pacific Northwest National Laboratory, and Siemens, among others."

