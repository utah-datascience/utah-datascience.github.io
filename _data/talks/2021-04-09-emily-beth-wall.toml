tags = ["fairness & ethics", "visualization"]
abstract = """
Visual Analytics combines the complementary strengths of humans (perception and sensemaking capabilities) and machines (fast and accurate information processing). However, people are susceptible to inherent limitations and biases, including cognitive biases (e.g., anchoring bias), social biases borne of cultural stereotypes and prejudices (e.g., gender bias), and perceptual biases (e.g., illusions). These biases can impact data analysis and decision making in critical ways, leading to inaccurate or inefficient choices, or even propagating long-standing institutional and systemic biases.

Given our knowledge of these biases and the increased use of data visualization to support decision making in data science, the goal of this research is to detect and mitigate human biases in visual data analysis. In this talk, I describe (1) which types of bias are particularly relevant in the process of visual data analysis, (2) how user interactions with data can be used to approximate human biases, and (3) how visualization systems can be designed to increase user awareness of potentially unconscious or implicit biases. By creating systems that promote real-time awareness of bias, people can reflect on their behavior and decision making and ultimately engage in a less-biased analysis and decision making process.
"""

[[speakers]]
