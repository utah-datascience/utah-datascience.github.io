bio = "Vivek is a fifth-year doctorate candidate at the Utah NLP Group's at Kahlert School of Computing, University of Utah. He is fortunate to be advised by Prof. Vivek Srikumar. He is broadly interested in NLP research in semi-structured data and low-resource languages. He is awarded Bloomberg Data Science Fellowship 2021-23, the Best paper award at the DeeLIO 2022 workshop, and the Outstanding paper award at the NLP4ConvAI 2022 workshop . He currently also serves as the Utah Data Science Club's coordinator. He used to be a Research Fellow (Microsoft Research Fellowship 2016–18) at the Microsoft Research Lab, India, where he worked with the Machine Learning and Natural Language Processing group. In 2016, he graduated from IIT Kanpur as a dual degree (BS-MS) student in the Department of Computer Science and Engineering. He was the inaugural coordinator of IIT Kanpur's Special Interest Group in Machine Learning (SIGML)"

