bio = "Jes Ford is a sponsored snowboarder turned astrophysicist turned data scientist. She enjoys applying Python data science tools to a wide variety of problems, and teaching skills and best practices to others. Jes completed her PhD in Physics at UBC Vancouver in 2015, and did a Postdoc in Data Science at the University of Washington under Jake VanderPlas. Currently based in Salt Lake City, she works remotely for Cash App (Block) as a Senior Machine Learning Engineer, and previously held local data science positions at Recursion and Backcountry. Jes spends her free time exploring the Wasatch mountains on snowboard, mountain bike, and foot. She has been involved in organizing the Salt Lake PyLadies chapter and the local Women in Data Science Conference, and is always looking for fun ways to be a part of her local tech community."

