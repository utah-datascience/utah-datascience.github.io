bio = "Sameer Honwad, Ph.D., is an Assistant Professor of Learning Sciences in the Department of Learning and Instruction at SUNY Buffalo. His research explores how technology can support learning in culturally diverse communities worldwide through participatory design approaches. At the heart of his work are long-term, trust-based partnerships with Indigenous communities in Idaho, rural and Indigenous communities in Bhutan and India, and urban communities in New Orleans. Rather than parachuting in with ready-made tools, Dr. Honwad co-designs technology-enhanced learning environments alongside teachers, parents, local leaders, and students, positioning community members as essential partners, not subjects of study. His current research examines how rural communities in South Asia make sense of and use artificial intelligence in everyday life. Grounded in participatory design-based research, Dr. Honwad centers communities that have historically faced systemic barriers to technology access due to class, race, gender, and caste. He has served as PI and Co-PI on multiple National Science Foundation (NSF) grants focused on designing technologies that help learners grapple with complex, real-world problems rooted in their own communities. Throughout his career he has taught courses that focus on how people learn within their cultures and the design of technology-enhanced learning environments that honor local knowledge, needs and aspirations. He is currently in the process of building a Global Design Studio that would be an interdisciplinary hub connecting scholars, students, and community members worldwide to think critically about AI and its role in everyday life."

