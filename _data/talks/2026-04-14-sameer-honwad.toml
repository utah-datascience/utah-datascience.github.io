abstract = """
Socio-emotional learning (SEL) and reflection are foundational components of quality education, yet they remain underrepresented in many school curricula. Reflection supports scientific thinking and inquiry, while SEL equips students with the emotional resilience needed to take risks, embrace failure, and navigate the uncertainties inherent in learning and innovation. Together, these competencies are essential not only for academic and professional growth, but for everyday wellbeing.Implementing SEL and reflective practices in rural India presents distinct challenges. Limited access to trained professionals and consistent resources is compounded by cultural stigma around openly discussing emotions, barriers that make it difficult for students to develop these critical skills in traditional school settings.

To address this gap, we designed a conversational chatbot tailored for students in rural India, providing a low-barrier, accessible space for daily reflection and emotional expression. Importantly, the chatbot is also designed to serve as a springboard for teachers to introduce concepts of AI literacy, enabling meaningful classroom conversations about how AI systems work, their limitations, and the ethical considerations surrounding their use. This presentation presents the co-design process behind the chatbot, highlighting the collaborative contributions of an interdisciplinary team comprising teachers, therapists, computer scientists, and learning scientists. The presentation discusses how this cross-disciplinary approach shaped a tool intended to help students engage with their socio-emotional selves and build a habit of reflective thinking in their daily lives.
"""

