abstract = "Machine learning and more specifically deep learning has revolutionized computer vision and images analysis problems in a wide range of application areas. In this talk, we will outline four applications ranging from material science to health informatics and medical image analysis. We will discuss challenges unique to each problem and our approach using machine learning. A common theme underlying these problems is the difficulty of obtaining annotated data. Our contributions towards solving this problem ranging from new semi-supervised learning formulations to leveraging existing workflows of experts to collect annotations will be introduced."

