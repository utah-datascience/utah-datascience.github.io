bio = "Prof. Tasdizen received the B.S. degree in electrical and electronics engineering from Bogazici University, Istanbul, Turkey. He received the M.S. and Ph.D. degrees in engineering from Brown University. He is currently a professor at the Department of Electrical and Computer Engineering, University of Utah. His research interests include image processing and computer vision with a focus on applications in biological, medical image analysis and material science. He is a recipient of the National Science Foundation’s CAREER Award. His research has been funded by NSF, NIH, VAH, DOE and DHS."

