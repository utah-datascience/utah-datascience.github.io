abstract = """
Multi-fidelity learning involves using training examples at different fidelities or resolutions. High-fidelity examples are of high-quality but often are much more costly to collect than inaccurate, low-fidelity examples. How to retrieve and leverage examples at multiple fidelities is the key to reduce the learning cost while maximizing efficiency.

This talk will introduce our recent work in multi-fidelity learning and optimization. First, I will introduce our deep auto-regressive models that can capture complex correlations across the fidelities to integrate examples of high-dimensional outputs. These are common in applications of physical simulation. Second, I will introduce our work of deep multi-fidelity active learning and Bayesian optimization that can improve the learning and optimization efficiency while reducing the cost of generating training examples, namely maximizing the benefit-cost ratio. Finally, a batch version of the active learning and optimization technique will be presented, which can reduce the query redundancy, improve diversity, and further boost the benefit-cost ratio. I will showcase the advantage of our methods in standard benchmarks of physical simulation, topology structure optimization, and typical tasks in hyper-parameter tuning/AutoML.
"""

