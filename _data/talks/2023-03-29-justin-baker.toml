abstract = "From social networks to chemical engineering, deep graph neural networks play an instrumental role in advancing our industrial and scientific frontier. Of particular interest are networks which can learn long range dependencies in a scalable and expressive manner. In this talk, we will delve into the power of deep learning on graphs, with a focus on implicit graph neural networks (IGNNs) and their scalability. We will also discuss how monotone operator theory enhances the expressivity of IGNNs, overcoming a crucial obstacle to learning long-range dependencies. By doing so, monotone IGNNs can significantly improve graph learning and have the potential to make breakthroughs in various fields."

