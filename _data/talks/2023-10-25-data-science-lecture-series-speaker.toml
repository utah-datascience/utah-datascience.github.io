abstract = "Sparsity is a fundamental assumption that allows us to compute efficiently on and find parsimonious solutions to science and engineering problems. Sparsity exists in all basic sciences such as physics, biology, and chemistry. I am going to give a sampling of recent work we have done on sparse computations. My talk will travel across diverse problem domains including randomized linear algebra, graph neural networks, protein family and structure discovery from metagenomic data, and tensor computations. The underlying theme will be the challenges posed by sparsity and the computational techniques we employ to overcome these challenges."

