abstract = """
Hypergraphs capture multi-way relationships in data, and they have
consequently seen a number of applications in higher-order network
analysis, computer vision, geometry processing, and machine learning.
In this talk, I will discuss hypergraph analysis and visualization.
In particular, I will focus on developing the theoretical foundations
in studying the space
of hypergraphs using ingredients from optimal transport.

This talk is
based on joint works
with Youjia Zhou, Archit Rathore, Emilie Purvine, Samir Chowdhury, Tom
Needham, and Ethan Semrad.
"""

