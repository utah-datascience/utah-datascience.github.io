bio = """
Dr. Qiang Ji received his Ph.D. in Electrical Engineering from the University of Washington. He is currently a Professor in the Department of Electrical, Computer, and Systems Engineering at Rensselaer Polytechnic Institute (RPI). From 2009 to 2010, he served as a Program Director at the National Science Foundation (NSF), where he managed NSF’s research programs in computer vision and machine learning. He has also held teaching and research positions at the University of Illinois at Urbana–Champaign, Carnegie Mellon University, the University of Nevada, and the Air Force Research Laboratory.

Prof. Ji’s research focuses on computer vision, probabilistic graphical models, Bayesian deep learning, and causal machine learning, with applications across a wide range of domains including human behavior analysis, medical imaging, intelligent transportation, and human–robot interaction. He has published over 400 papers in leading journals and conferences and has received multiple awards recognizing his contributions to the field.

Prof. Ji has served the research community extensively as an editor for several IEEE and international journals and as a General Chair, Program Chair, Area Chair, and Program Committee member for numerous major international conferences and workshops. He is a Fellow of both the IEEE and the International Association for Pattern Recognition (IAPR).
