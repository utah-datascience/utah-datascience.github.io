abstract = """
Artificial Intelligence (AI) has achieved remarkable progress and is increasingly integrated across a wide range of fields, fueling what many describe as the fourth industrial revolution. However, behind this widespread enthusiasm lie fundamental limitations. Today’s AI systems face three major challenges: (1) an insatiable demand for large-scale labeled data, (2) limited trustworthiness due to inadequate uncertainty quantification, and (3) poor generalization across domains. These challenges cannot be addressed simply by scaling data and computation; instead, they require foundational advances in theory and methodology.

In this talk, I will present recent research from my lab that addresses these challenges in a variety of computer vision tasks. To improve data efficiency and generalization, I will introduce our work on knowledge-augmented deep learning, where prior knowledge from diverse sources is systematically identified, encoded, and integrated with data-driven neural networks. This approach leads to hybrid neural-symbolic models that are both more data-efficient and more generalizable. To enhance model trustworthiness and explainability, I will discuss our advances in Bayesian deep learning. First, I will present our work on a Bayesian Transformer framework for accurate and robust human activity recognition. I will then introduce our work on uncertainty attribution, which identifies the sources of uncertainty in deep models and leverages this information for uncertainty mitigation and improved model performance. Finally, I will highlight our recent work on causal deep learning for addressing domain generalization. I will introduce a neural causal model that learns domain-invariant representations by identifying and eliminating spurious correlations arising from data biases.

Together, these efforts aim to advance a new generation of AI systems that are more data-efficient, trustworthy, and robust, enabling reliable deployment across a range of domains including human behavior understanding, medical imaging, scientific discovery, and human–robot interaction.
"""

