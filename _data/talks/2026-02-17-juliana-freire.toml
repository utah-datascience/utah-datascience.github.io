abstract = """
**Abstract:**
The proliferation of structured data across open-data portals, the web, and enterprise data lakes presents unprecedented opportunities for scientific discovery and data-driven decision-making. However, realizing this potential requires solving fundamental challenges in data discovery and integration: How do we find relevant datasets among millions of candidates? How do we understand their semantics to integrate them? And how do we build systems that are scalable, accurate, and cost-effective?

In this talk, I will present our recent work addressing these challenges by combining techniques from data management, visualization, HCI, and modern language models. Our work is motivated by real-world problems across domains: supporting biomedical researchers in integrating heterogeneous datasets, enabling dataset search over urban data for policy analysis and planning, and augmenting training data to improve machine learning model performance.

First, I will describe how we are reimagining dataset discovery by designing specialized search engines, developing methods to automatically derive metadata, and introducing novel data-driven queries that go beyond keywords to support complex information needs. Then, I will turn to data integration, showing how we can leverage the semantic power of Large Language Models (LLMs) to match schemas with state-of-the-art accuracy. I will also argue for the critical importance of human-AI collaboration, demonstrating how visual analytics can effectively place the user in the loop to guide and verify these complex processes.

Finally, I will reflect on how LLMs are fundamentally changing computer science research. They make previously intractable problems like semantic data discovery and integration tractable, yet they behave more like natural phenomena, exhibiting variability and non-determinism. This shift forces us to move beyond deterministic algorithmic thinking and to practice computer science as a science, adopting empirical research methods to understand and leverage these powerful but unpredictable tools.

**Bio:**
Juliana Freire is an Institute Professor at the Tandon School of Engineering and Professor of Computer Science and Data Science at New York University, where she co-directs the Visualization Imaging and Data Analysis (VIDA) Center. Her research develops methods and systems that enable a wide range of users to obtain trustworthy insights from data. It spans topics in large-scale data analysis and integration, visualization, machine learning, provenance management, and web information discovery, addressing application areas including urban analytics, predictive modeling, computational reproducibility, and biomedical data harmonization. She has co-authored over 250 papers, including 12 award winners and a test-of-time award. She served as elected chair of ACM SIGMOD and as a council member of the Computing Community Consortium (CCC), and was the NYU lead investigator for the Moore-Sloan Data Science Environment. She is a Fellow of the ACM and AAAS, and a winner of the ACM SIGMOD Contributions Award. Her work has been supported by funding agencies and industry partners, including the National Science Foundation, DARPA, ARPA-H, the Department of Energy, the National Institutes of Health, and technology companies such as Google, Amazon, Microsoft Research, and IBM. Freire received her Ph.D. and M.Sc. degrees in computer science from the State University of New York at Stony Brook and her B.S. degree in computer science from the Federal University of Ceará in Brazil.
"""

