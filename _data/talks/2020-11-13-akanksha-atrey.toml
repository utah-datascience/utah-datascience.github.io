abstract = "Modern day distributed technologies, such as mobile systems and the Internet of Things (IoT), enable the global integration of heterogeneous smart devices via wireless networks. A common characteristic across these technologies is their ability to collect and communicate continuously streaming data. The generation of high bandwidth data makes machine learning (ML) and artificial intelligence (AI) appealing for processing, reasoning, and predicting about the environment, but low network latency requirements make offloading intelligence to the cloud undesirable. This raises an important question: how can we design, develop and evaluate ML algorithms that perform beyond predictive accuracy (e.g., generalizable, explainable, privacy-aware, and efficient) while being accessible and scalable in resource-constrained edge environments? In this talk, I will cover two aspects, explainability and privacy, when deploying such ML models in modern distributed technologies. The focus of the talk will be two-fold: (1) counterfactual evaluation of the explanations generated using saliency maps in deep reinforcement learning for applications such as autonomous vehicles, and (2) privacy implications of personalized ML models in context-aware mobility applications. The talk will be concluded with a discussion on where the future of ML lies in evolving distributed technologies."

[[speakers]]
name = "Akanksha Atrey"
