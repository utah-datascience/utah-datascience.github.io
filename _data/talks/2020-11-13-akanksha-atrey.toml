bio = "Akanksha Atrey is a Ph.D. student in the College of Information and Computer Sciences at the University of Massachusetts Amherst. She is a member of the Laboratory of Advanced Software Systems, where she is advised by Prof. Prashant Shenoy. Her research interests lie at the intersection of machine learning, edge computing, and privacy with a focus on applications in IoT and mobile computing. Her work seeks to make machine learning more available, usable, and scalable for applications in edge systems. Prior to joining UMass, she was a software engineer at IBM where she worked on the IBM z/OS Mainframe. In 2016, she received her Bachelor of Science degree in Mathematics and Computer Science from the State University of New York at Albany. Among her achievements, she has been named a CRA-W Research Scholar, received an Honorable Mention for the NSF Graduate Research Fellowship Program, and received the Lori A. Clarke Scholarship in Computer Science."

