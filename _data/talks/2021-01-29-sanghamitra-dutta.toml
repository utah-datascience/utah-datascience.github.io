bio = "Sanghamitra Dutta (B. Tech. IIT Kharagpur) is a doctoral candidate in the Department of Electrical and Computer Engineering at Carnegie Mellon University, PA, USA. Her research interests revolve around machine learning and information theory. She is currently focussed on addressing the emerging trust issues in machine learning concerning fairness, privacy and reliability. Her work bridges the fields of information theory, causality, reliability and machine learning. In her prior work, she has also examined problems in reliable computing, proposing novel algorithmic solutions for large-scale machine-learning in the presence of faults and failures, using tools from coding theory (an emerging area called “coded computing”). Her results on coded computing address problems that have been open for several decades and have received substantial attention from across communities. She is a recipient of the 2019 K&L Gates Presidential Fellowship, 2019 Axel Berny Presidential Graduate Fellowship, 2017 Tan Endowed Graduate Fellowship, 2016 Prabhu and Poonam Goel Graduate Fellowship, and the 2014 HONDA Young Engineer and Scientist Award."

