bio = "Marina Kogan is an Assistant Professor at Kahlert School of Computing at University of Utah. She works in the areas of social computing, crisis informatics, and human-centered data science. Her background in Sociology and Computer Science informs her focus on studying online coordination, collective problem-solving, and information flows during disruption events such as disasters arising from natural hazards and political crises. Her most recent work engages with issues of mis/disinformation, conspiracy theories, and state-sponsored information operations."

