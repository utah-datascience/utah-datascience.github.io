bio = "Eric Zeng is a Fritz Postdoctoral Fellow in the Department of Computer Science and the Massive Data Institute at Georgetown University. His research identifies and measures threats to users' safety, security, and privacy on technology platforms. His research focuses on disrupting the tools and distribution channels used to create and distribute AI-generated non-consensual intimate imagery, and measuring the harmful effects of algorithmic social media feeds on users. His previous work has investigated problematic online advertising, AI for cybersecurity in industrial control systems, home IoT privacy, and deploying end-to-end encryption for civil society. He earned his PhD in Computer Science & Engineering at the University of Washington, and recently worked as a postdoctoral researcher at Carnegie Mellon University CyLab."

