abstract = "Civil rights leader, educator, and investigative journalist Ida B. Wells said that \"the way to right wrongs is to shine the light of truth upon them.\" This talk will demonstrate how mathematical, statistical, and computational approaches can shine a light on social injustices and help build solutions to remedy them. We will present research-to-action projects on diversity in art museums, inclusion in STEM, equity in criminal sentencing, and other topics. The tools engaged include crowdsourcing, data cleaning, clustering, hypothesis testing, statistical modeling, Markov chains, data visualization, and much more. Overall, we hope that this talk leaves you informed about the breadth of social justice applications that one can tackle using quantitative tools in careful collaboration with other scholars and activists."

