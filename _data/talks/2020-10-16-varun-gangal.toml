tags = ["deep learning"]
abstract = "In the first third of our talk, we try to understand what and how much does BERT already know about event arguments (including cross-sentence ones)?. We observe that BERT's attention heads have modest but well above-chance ability to spot event arguments sans any training. Furthermore, we investigate how our methods do for cross-sentence event arguments, proposing a procedure to isolate \"best heads\" for cross-sentence argument detection separately of those for intra-sentence arguments. In the second third, we take a closer look at the infilling abilities of BERT. We know BERT is good at Word-level Infilling (obviously!) . How good is it though at Sentence-level Infilling a.k.a Cloze ? We introduce a human-created sentence cloze dataset, collected from public school English examinations. Our task requires a model to fill up multiple blanks in a passage from a shared candidate set with distractors designed by English teachers. Our experiments show a significant performance gap between BERT (72%) and humans (87%), encouraging future models to bridge this gap.We conclude our talk by going through a somewhat unrelated, recent foray into data augmentation for finetuning pretrained generators on low resource domains."

