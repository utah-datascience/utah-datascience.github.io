abstract = """
The journey toward decoding biology at scale began with a focus on high-dimensional cellular morphology. At Recursion, our differentiation centered on deep learning models designed to learn biological representations directly from imaging, enabling predictive inference at a massive scale. By leading multiple cross-functional teams from early-stage discovery through to early clinical development, we demonstrated the power of this "inference-first" philosophy. A primary highlight of these efforts was the RBM39 program, a novel molecular glue degrader discovered entirely through computational inference rather than traditional screening. This success proved that models could identify complex biological mechanisms; however, moving from cellular discovery to comprehensive patient care requires a leap into even higher-dimensional, clinical data.

Valinor represents the next evolution of this mission. We build multimodal clinical foundation models, co-designing data collection and model architecture to maximize signal within and across complex modalities. We have proprietary access to patient cohorts and collaborate with biobanks, clinical trial sites, and academic partners, giving us unique data advantages at scale. Our approach is to first build the best unimodal patient representations across modalities—including DNA, transcriptomics, proteomics, cfDNA, histopathology, and patient reports—and then fuse them.

We have shown that attention-based fusion consistently outperforms unimodal approaches while making the contributions of different modalities interpretable. This enables genuine clinical reasoning: the model can chain evidence across modalities, explain which features drive a prediction, and engage with clinicians in natural language. Ultimately, we envision a virtual patient that reasons over the full spectrum of a patient's biology the way an expert clinician would, but at a scale and resolution no human can match.
"""

