bio = """
I believe the next generation of life-saving medicines won't just be discovered; they will be engineered at the intersection of biology and machine learning.
During my time at Recursion, I operated at the frontier of "AI for Drug Discovery," translating high-dimensional data into actionable therapeutic programs. I led cross-functional teams through the critical transition from late-stage discovery into early clinical development, ensuring that AI-driven insights were successfully translated into clinical-ready drug candidates.

With a PhD in Translational Medicine from CCLCM at Case Western Reserve University, I bridge the gap between translational oncology and computational innovation. My work has focused on deconstructing complex disease mechanisms and scaling them through automated, industrialized platforms.

I am a passionate advocate for the "TechBio" shift—moving away from serendipity and toward a predictable model of drug discovery to get better medicines to patients, faster. In late 2025, I co-founded Valinor Discovery to bridge the gap in clinical translation using foundation models trained on real-world multi-modal clinical data.
"""

