bio = "Danish Pruthi is a senior Ph.D. student at School of Computer Science in Carnegie Mellon University. Broadly, his research aims to enable machines to understand and explain natural language phenomena. He completed his bachelors degree in computer science from BITS Pilani, Pilani in 2015. He has also spent time doing research at Google AI, Facebook AI Research, Microsoft Research, and Indian Institute of Science. He is a recipient of the Siebel Scholarship, and CMU Presidential Fellowship."

