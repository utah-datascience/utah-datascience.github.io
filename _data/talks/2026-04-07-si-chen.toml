abstract = "Artificial intelligence (AI) is rapidly transforming education and how people learn, teach, and prepare for the future. Yet many systems are still built around technical capabilities rather than the real needs of students, educators, and families. In this talk, I present a human-centered design research agenda that advances both AI literacy and AI for teaching and learning across students, families, and educators. First, I define and conceptualize generative AI literacy across children and parents by co-designing measurement frameworks and interactive tools. This work enables families to build a shared understanding of AI while supporting its critical and responsible use in everyday self-directed learning contexts. Second, I present AI Academy, an faculty-facing professional development program and badge system that expands institutional capacity for AI. Through curriculum design and lightweight tools, this work supports faculty in integrating generative AI into teaching while strengthening their AI literacy and maintaining pedagogical and disciplinary goals. Lastly, I present AI-powered tutoring systems and other AI interactions I have developed with college learners with disabilities, including LLM-based chatbots, particularly for Deaf and Hard of Hearing students.The talk is intended for a broad, interdisciplinary audience."

