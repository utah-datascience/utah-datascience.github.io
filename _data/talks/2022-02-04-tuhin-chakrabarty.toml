abstract = "Despite the ubiquity of figurative language across various forms of speech and writing, the vast majority of NLP research focuses primarily on literal language. Figurative language is challenging because of its implicit nature. In this talk, I will specifically focus on the following questions: 1) Can large language models understand/interpret them? 2) Can computers generate figurative language?"

