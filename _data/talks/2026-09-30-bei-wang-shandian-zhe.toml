abstract = """
Large-scale scientific simulations — in fluid dynamics, climate,
combustion, and beyond — are increasingly outpacing our ability to
store, transfer, and analyze them at full resolution. A growing
alternative to storing raw discretized grids is the continuous
implicit model, such as multivariate functional approximation (MFA)
and implicit neural representations (INRs). These represent a
simulation's fields as continuous functions that can be queried at
arbitrary points and differentiated exactly, with no resampling
required. This talk presents a line of work building the topological
data analysis toolkit needed to make such continuous representations
practically useful. First, we show how to extract critical points —
the maxima, minima, and saddles that organize a scalar field's
structure — directly from an MFA model, without ever discretizing back
to a grid. Second, we extend this to richer topological descriptors:
contours (isosurfaces), Jacobi sets (the shared critical structure
between two co-registered fields, useful for comparing related
quantities like pressure and temperature), and ridge-valley graphs,
which trace filamentary or ridge-like structure in the data. Third, we
introduce a framework for tracking these topological features
continuously through time or parameter space, following critical
points as smooth trajectories using the model's own derivatives rather
than resampling frame by frame — avoiding the aliasing artifacts that
plague discrete feature tracking. Together, these methods point toward
a workflow in which large-scale data is stored once as a continuous
functional surrogate, and structural analysis — feature detection,
comparison across fields, and evolution over time — happens directly
on that surrogate, at whatever resolution the analysis demands. This
work is joint with Guanqun Ma, David Lenz, Tom Peterka, Hanqi Guo,
Kaiyuan Tang, and Chaoli Wang.

Speaker 2: Shandian Zhe (UU KSoC)
