abstract = "Patients with type 2 diabetes have increasingly many treatment options, but responses to these therapies vary substantially across individuals and across outcomes such as glycemic control, weight, cardiovascular events, kidney outcomes, and hypoglycemia. In this talk, I will describe our work using large-scale electronic health record data, causal inference, and machine learning to characterize treatment heterogeneity and develop approaches for individualized treatment selection. I will discuss challenges in reconstructing longitudinal treatment regimens from real-world prescribing data, predicting multiple patient outcomes, and identifying the level of patient-specific resolution that can be reliably supported by available data. I will also discuss how these methods can ultimately support patient-centered treatment comparisons and clinical decision making."

