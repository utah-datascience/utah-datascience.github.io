bio = "Polina Kukhareva, PhD, MPH, is a Research Assistant Professor of Biomedical Informatics at the University of Utah. Her research focuses on developing and evaluating methods that use electronic health record and clinical trial data to improve personalized treatment decisions. Her current work applies causal inference, machine learning, and real-world data to understand heterogeneity in treatment response, particularly for type 2 diabetes and cardiometabolic disease. She is the principal investigator of an NIH/NIDDK K01 award focused on building equitable predictive models for personalized diabetes pharmacotherapy."

