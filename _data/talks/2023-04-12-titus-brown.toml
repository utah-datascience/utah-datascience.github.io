bio = "C. Titus Brown is a Professor at the School of Veterinary Medicine at UC Davis, where he works on effective large scale sequencing data analysis, methods development, training, and open science. His most recent work focuses enabling on petabase-scale search of all available public microbiome data, with the goal of better hypothesis generation and refinement. He tweets at @ctitusbrown and blogs at http://ivory.idyll.org/blog/. His google scholar profile is reasonably up to date but is nevertheless highly misleading."

