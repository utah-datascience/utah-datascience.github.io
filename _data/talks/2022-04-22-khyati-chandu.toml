bio = "Dr. Khyathi Chandu is a Research Scientist at Meta AI. Prior to this, she completed her Ph.D. at Carnegie Mellon University, working on controllable generation and multimodality. The avid goal of her research is to enable seamless communication between humans and machines with multiple modalities and languages. Her research focuses on improving vision-and-language generation, by adapting to appropriate content, structure, and persona, particularly in long-form generation. She has also done an array of work in code-switching and biomedical text summarization. She was selected as Rising Stars EECS 2020, won the sixth edition of the BioAsq challenge, organized several workshops at *CL conferences, and co-chaired D&I initiatives at NLP conferences and WiNLP workshops. She has consistently been on the Dean’s Merit list and was awarded the Best All-Rounder Student in her undergraduate. She is also an editor for the Machine Learning Blog at CMU and loves designing creative content in her free time."

