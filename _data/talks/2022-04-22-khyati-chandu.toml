tags = ["computer vision", "education", "machine learning", "natural language processing"]
abstract = """
Humans inherently learn from and interact with multiple views of information, be it various modalities or languages. So, the expectations from contemporary and 21st-century technology are a testimony to the increasing need to model these multiview contexts better. Natural language generation plays a pivotal role in communicating these contexts in human-understandable languages. This talk brings together both of these transformative technologies to make strides toward a longstanding dream of human-like multiview narrative generation. The critical challenge is identifying the natural-sounding properties of long-form texts and modeling them in tandem with visual contexts. I present anchors for grounding three such properties including content (relevance), structure (coherence), and surface form realization (expression), and anchors them with relevant visual contexts. These anchors also provide us with human interpretable handles for controlling these properties.

Details: To illustrate the effectiveness of the anchors for each of the three properties, I present: Starting with content: In situated multimodal contexts, relevance is the concept of the elements in one modality being connected to the other modality that makes this context informative and complementary. I present visual infilling with curriculum learning as a global objective for content and hierarchically attending over entity skeletons as a local objective for content, to generate visual stories and procedures. To improve the controllability and transferability in English and five other languages, I also introduce a dual-stage model with weakly supervised skeletons and a text-as-side attention mechanism to denoise the content in an image caption. Moving onto structure: The alignment of descriptions in language to the corresponding visual inputs is crucial to generating a logical and coherent narrative. I present a scaffolding technique as a local objective for structure by extracting a layout from vast amounts of unsupervised text to incorporate structure into cooking recipes generated from images. Finally, surface form: The crux of naturalness to automatic generation comes by incorporating individualized and personalized ways of expressing the same content. I present a locally guided, weakly supervised model for generating persona-based visual stories and a dual-staged adversarial technique to generate mixed views from non-parallel data. All of the above work mainly focuses on static multimodal narratives, and finally, I present a case to highlight the significance of transitioning to dynamic grounding. I conclude by presenting the shortcomings of the current approaches in the NLP domain to the grounding problem and offer recommendations along with executable actions for course correction to bridge this gap and enable grounding for machines to resemble human communication.
"""

