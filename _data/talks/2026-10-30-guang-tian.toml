abstract = "Cities generate data about travel, land use, infrastructure, and human behavior, yet these data remain fragmented, sensitive, and difficult to translate into planning decisions. This talk presents an urban data science framework that connects data collection, management, visualization, spatial analysis, and computation. Drawing on household travel surveys and built-environment databases, it demonstrates how statistical models and machine learning reveal nonlinear relationships between cities and travel behavior. Examples include computer-vision systems that inventory bus-stop amenities and measure urban design from street imagery. This talk concludes with opportunities for interdisciplinary research, education, and collaboration linking data science with healthy and sustainable urban planning."

