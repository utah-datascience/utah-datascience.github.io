bio = "Guang Tian, Ph.D., is an Assistant Professor of City and Metropolitan Planning and faculty member of the Scientific Computing and Imaging Institute at the University of Utah. His interests and research focus on land use and transportation planning, travel behavior and built environment, sustainability and climate, urban data science and analytics (statistics, GIS, machine learning, AI, etc.). Before joining the University of Utah, Dr. Tian was an Associate Professor and coordinator of the GIS graduate certificate at the University of New Orleans, where he founded the Center for Equitable Transit-Oriented Communities (CETOC) – a U.S. Department of Transportation designated University Transportation Center. CETOC focused on preserving the environment by promoting transit access, multimodal infrastructure, compact and efficient land use patterns, as well as resilience and climate adaptation. Dr. Tian has published dozens of academic papers in peer-reviewed journals of transportation, planning, and geography. He is recently selected as the University of Utah One-U Responsible AI (One-U RAI) faculty fellow."

