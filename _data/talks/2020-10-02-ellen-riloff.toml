bio = """
Ellen Riloff is a Professor in the School of Computing at the
University of Utah. Her primary research area is natural language
processing, with an emphasis on information extraction, affective text
analysis, semantic class induction, and bootstrapping methods that
learn from unannotated texts. Prof. Riloff has served as the General
Chair for the EMNLP 2018 conference, Program Co-Chair for the NAACL
HLT 2012 and CoNLL 2004 conferences, on the NAACL Executive Board for
2004-2005 and 2017-2018, the Computational Linguistics Editorial
Board, and the Transactions of the Association for Computational
Linguistics (TACL) Editorial Board. In 2018, Prof. Riloff was named a
Fellow of the Association for Computational Linguistics (ACL).
"""

