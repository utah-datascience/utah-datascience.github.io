abstract = """
Recognizing affective states is essential for narrative text
understanding and for applications such as conversational dialogue,
summarization, and sarcasm recognition. Many tools have been developed
to recognize explicit expressions of sentiment, but affective states
can also be inferred from events. This talk will focus on "affective
events", which are generally desirable or undesirable experiences that
implicitly suggest an affective state for the experiencer. For
example, buying a home is usually desirable and associated with a
positive affective state, but being laid off is undesirable and
associated with a negative state. First, we will describe a weakly
supervised learning method to induce affective events from a text
corpus by optimizing for semantic consistency. Second, we aim to
characterize affective events based on Human Needs Categories, which
often explain people's motivations, goals, and desires. We will
present a co-training model for Human Needs categorization that uses
an event expression classifier and an event context classifier to
learn from both labeled and unlabeled texts.
"""

