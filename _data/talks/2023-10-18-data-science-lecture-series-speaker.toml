abstract = """
DBSP is a simple streaming programming language inspired by Digital Signal Processing [DSP]. DBSP can be used to give a precise definition of incremental computations -- operating on changes (deltas, diffs). Moreover, given a DBSP program, a simple algorithm can convert it to a DBSP program that computes on changes. All practical database query operators (the relational algebra, group-by, aggregations, fixed-points, etc) can be expressed in DBSP. As a consequence we obtain an algorithm which can incrementalize essentially any database query. The DBSP theory has been formally verified using a theorem prover, making it the first verified theory of incremental view maintenance.

The DBSP paper has received the best paper award at the 2023 conference on Very Large Databases [VLDB].
"""

