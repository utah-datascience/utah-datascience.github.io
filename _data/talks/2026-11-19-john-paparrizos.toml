bio = "John Paparrizos is an assistant professor in the Department of Computer Science and Engineering at The Ohio State University and is also affiliated with the Aristotle University of Thessaloniki. His research lies at the intersection of data management, data mining, and machine learning, with a focus on developing scalable and reliable methods for analyzing data-intensive applications. His work has appeared in leading conferences and journals, including SIGMOD, VLDB, SIGKDD, ICML, NeurIPS, and ICDE, and has received several distinctions, including the 2026 NSF CAREER Award, the 2025 ACM SIGMOD Test-of-Time Award, and the 2023 IEEE TCDE Rising Star Award. His research has also received “Best of VLDB,” “Best of SIGMOD,” and ACM SIGMOD Research Highlight recognitions and has been featured in major media outlets, including The New York Times, The Washington Post, Forbes, and MIT Technology Review."

