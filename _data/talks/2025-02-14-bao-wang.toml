abstract = """
Conditional flow matching (CFM) stands out as an efficient simulation-free approach for training flow-based generative models, achieving remarkable performance for data generation. However, CFM is insufficient to ensure accuracy in learning probability paths, and the learned vector field significantly violates the continuity equation governing probability flows. In response, we establish a new total-variation bound between the learned and ground-truth probability paths, showing that the gap between probability paths is bounded above by a combination of CFM loss and an associated divergence loss. This theoretical bound informs us to design a new objective to match both flow and divergence accompanied by an efficient implementation. Our new training approach improves the performance of the flow-based generative model by a noticeable margin without significantly raising the computational cost.

Talks will be held in WEB L112, and also streamed via the following Zoom link: https://utah.zoom.us/j/93909986581?pwd=d90LoHKoVAkagz1aCpJH1vTuaME9gG.1
"""

