tags = ["networks & graphs"]
abstract = "Homophily is the well-known sociological principle that people tend to connect with others who are similar to them, or more informally: \"birds of a feather flock together.\" Although many social interactions occur in groups, homophily is typically measured using a graph, which only accounts for interactions involving two individuals. This talk will present a new hypergraph framework for more directly measuring homophily in group settings. Our measures highlight natural patterns in group homophily that appear with gender in scientific collaboration and political affiliation in legislative bill cosponsorship, and also reveal distinctive gender distributions in group photographs, all of which cannot be fully captured by graph-based measures. We will also discuss subtle combinatorial limits and impossibilities that arise when measuring homophily in hypergraphs, which are completely independent of human behavior and must be properly accounted for in order to understand how homophily can (and cannot) be manifested in group interactions."

