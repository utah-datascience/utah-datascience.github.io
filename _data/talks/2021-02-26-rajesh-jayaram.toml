bio = "Rajesh Jayaram is a PhD student at Carnegie Mellon University, advised by David Woodruff. His research focuses on the design of sketching algorithms, especially streaming and distributed algorithms, for problems in big-data. A central theme of his work is the usage of sketching techniques to speed up algorithmic tasks across various applications, such as in machine learning, optimization, databases, and numerical linear algebra. Additionally, he is interested in aspects of robustness in machine learning and streaming. His work in sketching has received two Best Paper Awards at the Symposium on Principles of Database Systems (PODS) in 2019 and 2020."

