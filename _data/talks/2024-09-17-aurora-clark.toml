abstract = "Data in the field of Chemistry has heavily leveraged graph theory representations within data science applications. However, there is a rich geometric and topological structure of many chemical systems (and their data) that has been less employed for feature optimization, dimensionality reduction, and predictive models. Within this discussion I will highlight some recent work and interests that seek to employ computational topology and geometry within chemistry data sets from molecular dynamics simulations – both in the context of ensemble average and temporally evolving data sets."

