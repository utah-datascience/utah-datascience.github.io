abstract = "Visualization and computational systems are increasingly powerful, but their impact depends on a persistent, often under-specified factor—human judgment. Designers frame problems and negotiate constraints; users interpret, challenge, and coordinate action around system outputs over time, under uncertainty and constraint. In this talk, I present a research agenda on visualization and judgment in data-rich work, grounded in empirical studies and design-oriented analyses across three contexts. First, I study data visualization design practice, showing how professional designers frame problems and co-evolve problem and solution spaces—work that is often invisible in pipeline-oriented accounts of visualization. Second, I examine expert judgment in complex sociotechnical settings, where visualization, procedures, and automation reshape decision spaces and can either support adaptive performance or encourage brittle reliance. Third, I extend these insights to scientific cyberinfrastructure, where platforms exposing advanced computation and data services succeed or fail based on whether diverse communities can understand, adopt, and sustain capabilities in practice. This perspective complements advances in modeling, simulation, and visual analytics by surfacing design constraints, evaluation targets, and failure modes that matter as systems intersect with the constraints and contingencies of practice. I close with directions for judgment-aware visualization and human–AI support that preserve interpretability, accountability, and coordination in consequential domains."

