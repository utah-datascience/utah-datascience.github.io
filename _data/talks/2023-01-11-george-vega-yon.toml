abstract = "Biomedical sciences, in particular, bioinformaticians and computational biologists, are in a race to annotate the immense number of genes and gene products we are still learning from. In this talk, I present a new method for predicting gene functions using mechanistic machine learning. Mechanistic machine learning is a relatively new area of research where predictive ML-based algorithms are improved by incorporating domain knowledge via mechanistic models. Here, we use a theoretically-funded function evolution model that relies solely on phylogenetic trees from PantherDB and annotations from the Gene Ontology (GO) to make high-quality predictions. I will illustrate how combining the mentioned model with a large gene expression database (Bgee) in an ML model significantly improves prediction quality."

[[speakers]]
