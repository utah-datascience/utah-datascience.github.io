bio = "Dr. George G. Vega Yon is a research assistant professor of epidemiology at the University of Utah. Dr. Vega Yon is a methodologist that uses statistical computing tools to study complex systems. His research includes statistical models for social network analysis, agent-based models, and phylogenetics. Dr. Vega Yon has over ten years of experience working in data science creating scientific software, including multiple R packages in data visualization, network science, high-performance computing, and bayesian statistics. George is originally from Chile and obtained his Ph.D. in biostatistics from USC, an M.Sc. in Social Science from Caltech, and an M.A. in economics and public policy from Universidad Adolfo Ibáñez. (https://ggv.cl)"

