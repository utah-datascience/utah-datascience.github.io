abstract = "Although predictions from machine learning models influence more and more of our lives, the standard way of posing a ML problem has remained relatively unchanged for decades. In the search for better models, a new and popular family of techniques (sometimes called Graph Machine Learning) has emerged. These techniques rely on expanding beyond the features of an individual entity and instead look to pull information from its relationships. The methods offer a tantalizing way of improving task performance by leveraging previously unused information. However, it is not a free lunch, as these models can be more complex, difficult to train, and may have challenges in interpretability. This talk will discuss the fundamentals of graph machine learning, a few models, and some insights from years of real-world applications."

