bio = """
Bryan Perozzi is a Research Scientist in Google Research’s Algorithms and Optimization (https://ai.google/research/teams/algorithms-optimization/) group, where he routinely analyzes some of the world’s largest (and perhaps most interesting) graphs. Bryan’s research (https://scholar.google.com/citations?hl=en&user=rZgbMs4AAAAJ&view_op=list_works) focuses on developing techniques for learning expressive representations of relational data with neural networks. These scalable algorithms are useful for prediction tasks (classification/regression), pattern discovery, and anomaly detection in large networked data sets.

Bryan is an author of 40+ peer-reviewed papers at leading conferences in machine learning and data mining (such as NeurIPS, ICML, ICLR, KDD, and WWW). His doctoral work on learning network representations was awarded the prestigious SIGKDD Dissertation Award. Bryan received his Ph.D. in Computer Science from Stony Brook University in 2016, and his M.S. from the Johns Hopkins University in 2011.
