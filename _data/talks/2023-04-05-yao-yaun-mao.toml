abstract = "Dwarf galaxies are small fuzzy galaxies that contain much fewer stars than Milky Way-mass galaxies. Observations of these little galaxies can enhance our understanding of galaxy formation and the nature of dark matter. Finding these dwarf galaxies is, however, not an easy task because they are faint and dim from our perspective. I will describe the challenges and recent efforts on the search for nearby dwarf galaxies in astronomical surveys. One particular challenge is to identify potential dwarf galaxies with only image data that do not contain distance information. I will discuss a few traditional methods that are used to identify dwarf galaxies and obtain their astronomical distances, and why these methods are mostly used to find dwarf galaxies in specific patches of the sky. I will then discuss how the distance information can be used as training data in machine learning algorithms, such as convolutional neural networks, to derive distance information from just astronomical images. Finally, I will discuss the remaining challenges we have, and how we may improve the methods in preparation for future observations from the Rubin Observatory Legacy Survey of Space and Time (LSST) and Roman Space Telescope."

