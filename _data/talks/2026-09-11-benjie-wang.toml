bio = "Benjie Wang is an Assistant Professor in the Kahlert School of Computing at the University of Utah. Previously, he was a postdoctoral scholar at UCLA, a Simons-Berkeley research fellow at UC Berkeley, and received his DPhil (Ph.D.) in Computer Science from the University of Oxford. His research interests broadly span artificial intelligence, including generative modeling, probabilistic reasoning, natural language processing, and formal methods. His research develops theory and methods for embedding domain knowledge into generative AI in a reliable manner, with applications in learning biological networks, software testing, and robotics."

