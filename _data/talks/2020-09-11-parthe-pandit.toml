bio = """
Parthe is a 5th year Ph.D. candidate at UCLA in ECE and an MS candidate in Statistics, where he is advised by Allie K. Fletcher, Sundeep Rangan, and Arash A. Amini. He is currently a research intern with Amazon AWS and Amazon Search, working on problems in conditional text generation. He is interested in analyzing optimization problems arising out of Machine Learning, Statistics, and Information Theory. His past research includes theoretical results in Network Economics, Mechanism Design, and Approximating NP-hard problems in graph theory.

Parthe is the winner of the 2019 Jack K. Wolf Best Paper award, the Gurukrupa Foundation Fellowship, and scholarships from the J. N. Tata Endowment, and K. C. Mahindra foundation. In 2015, he received a B.Tech. and M.Tech. in Electrical Engineering at IIT Bombay, where he worked on Speech and Music Processing.
