tags = ["algorithms & theory", "deep learning", "machine learning", "optimization"]
abstract = """
At the heart of Machine Learning lies the question of generalizability of learned models over previously unseen data. While over-parameterized models based on neural networks are now ubiquitous in machine learning applications, our understanding of their generalization capabilities remains incomplete. This task is made harder by the non-convexity of the underlying estimation/learning problems.

The solutions to some of these estimation problems can be analyzed using a class of algorithms called Approximate Message Passing, even in the presence of the non-convexity. The dynamics of this algorithm follow a simplified macroscopic description often called the State Evolution. This analytical tool allows us to provide some insights into two broad classes of problems related to Neural Networks:

1. Generalization error in 1 and 2-layer Networks
2. Image Reconstruction error with Deep Image Priors
"""

