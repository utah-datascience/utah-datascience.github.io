bio = "Grace Guo is a Postdoctoral Fellow at Harvard University’s School of Engineering and Applied Sciences (SEAS). She received her Ph.D. in Human-Centered Computing from the Georgia Institute of Technology, where she was advised by Alex Endert. Her research sits at the intersection of visualization, explainable AI, and human-centered machine learning, with a focus on how AI interpretability tools can be designed for domain experts. To this end, Grace has collaborated with experts across healthcare, education, immunobiology, astrophysics, and causal analytics. She has previously worked at the Pacific Northwest National Laboratory and IBM Research, where she was awarded the IBM PhD Fellowship for her work on developing CausalVis. In her free time, she enjoys reading science fiction and mystery novels."

