bio = "Abhinav is a Ph.D. student in computer science at Michigan State University working with Prof. Xiaoming Liu. His current research focus is mathematical modeling applied to 3D object detection for autonomous driving. Before joining the graduate program at MSU, he was at the University of Utah and worked at Xerox Research Center India, Bangalore. He holds a master's and bachelor's in electrical engineering from the Indian Institute of Technology (IIT) Bombay and IIT Patna, respectively."

