bio = "Zhichao Xu is a final year Ph.D. student in Kahlert School of Computing, University of Utah. He is affiliated with UtahNLP lab and TDAVIS lab, advised by Prof. Bei Wang Philips and Prof. Vivek Srikumar. His main research interests include efficient NLP methods, web search & information retrieval. He has published in major IR venues such as TheWebConf, SIGIR, WSDM, CIKM, ICTIR and NLP venues such as NAACL and EMNLP."

