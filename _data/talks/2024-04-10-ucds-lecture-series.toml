bio = """
Dr Nitin Bakshi is department chair and Professor of Operations and Information Systems at the David Eccles School of Business, University of Utah. He focuses his research on the management of disruption risk in operations and supply-chain management, with an emphasis on “low-probability high-consequence” events. He is currently investigating how to manage reporting of accident precursors to enhance safety in dangerous operations, and exploring new frontiers related to efficiency in judicial operations.

He holds a B. Tech. in Electrical Engineering from IIT Bombay; an M.S. in Management Science from Stanford University; and a Ph.D. in Applied Economics from the Wharton School, University of Pennsylvania. Dr Bakshi has previously worked as a manager for Unilever and as an Algorithm Design Engineer for SmartOps Inc. Before joining the University of Utah he served on the faculty at the London Business School.
