tags = ["machine learning"]
abstract = "Machine learning (ML) models employed for real-world tasks will invariably encounter inference data that is distributionally shifted from their training datasets. Such out-of-distribution (OOD) examples can have adverse effects on model performance and can pose significant problems in high-consequence application areas like healthcare or autonomous vehicles. We develop a topological characterization of OOD examples and present a computationally feasible methodology for detecting such data in a deployed pipeline. The approach leverages the known property that well-trained ML models induce a topological “simplification” on its training dataset. By computing the persistent homology of the hidden layer embeddings of training and test data, we demonstrate empirically our ability to identify the presence of OOD examples for a given model."

