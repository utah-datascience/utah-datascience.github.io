bio = "Bhargavi is a second-year Ph.D. student in the Paul G. Allen School of Computer Science & Engineering, University of Washington, where she is advised by Hannaneh Hajishirzi and Luke Zettlemoyer. Her research interests include interpretability and explainability of neural models, managing model and dataset bias, and pre-training techniques for NLP. She earned an MS in Language Technology from LTI, Carnegie Mellon University, and a B.Tech in Computer Science and Engineering from IIT Kharagpur."

