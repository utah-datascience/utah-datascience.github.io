bio = "Sumana is a PhD student at McGill University (Mila), researching Deep Reinforcement Learning in Healthcare. Her work focuses on applying Reinforcement Learning to Autonomous Drug Dosing. She completed her Masters at Mila, where she studied deep learning for predicting Alzheimer's disease progression. She has also interned in the past at Meta AI (FAIR) on the fastMRI Active Acquisition project, using Reinforcement Learning to accelerate MRI acquisition, and will be interning at Microsoft Research Labs coming summer, on exploring Reinforcement Learning for optimizing genetic perturbation in Cancer Treatment."

