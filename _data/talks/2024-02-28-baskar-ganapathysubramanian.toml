bio = "Baskar Ganapathysubramaniam is Anderlik Professor of Engineering at Iowa State University. Baskar received his BTech from IIT Madras, and a PhD from Cornell University. He directs a curiosity driven, computational sustainability group (me.iastate.edu/bglab) with research interests in the areas of scientific computing, applied mathematics, and machine learning with applications in food, energy, and healthcare systems. He is the director of the NSF/USDA funded AI Institute for Resilient Agriculture (aiira.iastate.edu) which is a multi-institutional project (Iowa State, Carnegie Mellon, NYU, U Nebraska, U Arizona) focused on use-inspired AI developments."

