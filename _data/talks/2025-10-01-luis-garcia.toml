abstract = "Advances in computing and neuroscience are converging to enable new forms of recording and stimulation in naturalistic environments, or “neuroscience in the wild.” At the core of this effort is the ability to capture the human sensory experience, synchronized with intracranial recordings, to understand how brain activity relates to behavior in real-world contexts. I will share recent progress in building end-to-end pipelines for trustworthy brain–behavior research. I will begin with multimodal datasets we have collected during spatial navigation tasks, showing how hippocampal activity reflects context shifts such as doorways and landmarks. I will then discuss our work on event-driven synchronization, where large language models and human-in-the-loop oversight transform raw multimodal recordings into aligned, analyzable events. Building on this foundation, we are developing new platforms that combine neural signals, mobile sensing, and immersive environments to capture context in real time. I will also discuss our initial explorations on how extended reality can help manage the inherent noisiness of natural settings, and how privacy risks emerge when enabling sensors in sensitive environments. Together, these efforts outline a pathway toward reproducible, explainable, and privacy-preserving neural interventions in everyday life. Talks will be held in LNCO 1100, and also streamed via the following Zoom link: https://utah.zoom.us/j/81370106930?pwd=5rAKB2C2SrgkOprGOGuAtzeF5xxbbT.1"

