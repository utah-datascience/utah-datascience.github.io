abstract = "We have experienced firsthand the growing impact that AI technologies like ChatGPT have. It is agreed upon that risks involving such technologies must be managed. This is at a glance akin to how people handle safety-critical systems in, e.g., aviation. However, the rigorous principles of safety engineering are not easily applicable to AI technologies. AI-backed solutions are obscured in AI’s internals, and the exact requirements for AI safety are unverifiable since they are neither defined nor regulated. One technique that has emerged as a step to measure an aspect of AI safety is to construct data that represents a specific phenomenon that a safe model must handle well, and that has no spurious correlations. Low performance on the dataset is undesired.In this talk, I’ll focus on one common linguistic phenomenon, negation, without which the full power of human language-based communication cannot be realized. I will show how we carefully constructed a question-answering dataset, CondaQA, to study how well current models (described by the New York Time Magazine as “mastering language”) reason about negated statements. An InstructGPT model (the latest GPT model before Nov 28, 2022) combined with chain-of-thought prompting achieves 66.28% accuracy and 27.28% consistency on CondaQA, way behind human accuracy of 91.94% and consistency of 81.58%."

