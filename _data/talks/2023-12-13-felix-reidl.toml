abstract = """
Data Science and AI have an every increasing presence in our social, political and economic life. Given the immense influence the technologies of these field have and will have, I argue that researchers and academic institutions should reflect on the implications their work has in the world at large.

In this talk I would like take stock of the larger context: a world lacking futures, fragmented academic disciplines, and the dystopian use of technology. While we cannot hope to solve any of these problems, I argue that we can and should resist the underlying trends. To that end, I propose that our institutions should be constructed first and foremost around creativity and participation and what that could mean in practice.
"""

