abstract = "Unproven health claims on the internet may have substantial influence on patient behaviors and decision making. For example, cancer patients with curable disease who pursue unproven cancer treatment in lieu of evidence-based approaches demonstrate 2-4 times higher mortality than patients who avoid unproven cancer treatment. Interventions to mitigate the impact of online health misinformation are desperately needed. The few interventions that have been tested do not consider the extent of exposure to misinformation online, primarily because individual estimates of exposure are based on self-report and are considered highly unreliable. Web-monitoring software is typically used by businesses to monitor remote employee productivity. Our paradigm shifting approach applies web-monitoring to quantify online cancer misinformation exposure. We will discuss the feasibility of using web-monitoring software to quantify exposure to online health information with a special focus on cancer symptom management and unproven cancer treatment misinformation. Specifically, we will review 1) characteristics of online cancer health misinformation and the impacts this exposure may have on cancer patient health outcomes, relationships, and finances 2) Ethical considerations of web-monitoring, and 3) methodological rigor and reproducibility of web-monitoring approaches for studying exposure to other types of health misinformation online."

