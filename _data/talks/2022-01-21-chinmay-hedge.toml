bio = "Chinmay is a faculty member in the CSE and ECE Departments at the NYU Tandon School of Engineering. His research focuses on developing principled, fast, and robust algorithms for diverse problems in machine learning, with applications to imaging and computer vision, materials design, and transportation. Prior to NYU, he was an assistant professor in the Electrical and Computer Engineering Department at Iowa State University, and before that, a post-doctoral associate in the Theory of Computation (TOC) group at MIT, working with Piotr Indyk. He received his Ph.D. at Rice University under the supervision of Rich Baraniuk."

