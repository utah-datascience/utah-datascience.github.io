bio = "I am a Master’s student in the Computer Science department at the University of California, San Diego working with Prof. Jingbo Shang. I am broadly interested in Natural Language Processing, Text Mining, and Graph Mining. My current research revolves around developing principled data-driven approaches with minimal human effort. Specifically, there are huge amounts of unlabeled data available on the Internet and I try to leverage them to minimize the human effort. I completed my Bachelor of Technology in Computer Science And Engineering from the Indian Institute of Technology, Kanpur in 2017, where I worked with Prof. Harish Karnick, Prof. Purushottam Kar on Hierarchical Classification and Text Document Representation. I worked as a Data Scientist and Product Engineer at Sprinklr for 2 years and I interned at Microsoft India in the summer of 2016."

