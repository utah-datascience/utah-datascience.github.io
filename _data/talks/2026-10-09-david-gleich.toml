abstract = """
Magnetic graph matrices are powerful tools for modeling quantum systems and directed networks, but their application in network analysis has been limited by a lack of combinatorial understanding. We present a combinatorial interpretation that fundamentally reveals how these matrices encode local network structure. We further show that this structure information is highly compressible in real-world networks, enabling accurate approximations from a small number of magnetic potentials. This fresh foundation also unlocks further applications, like identifying crucial network motifs (e.g., frustrated directed cycles such as feed-forward loops) and enhancing directed link prediction.

Link to paper:
https://www.pnas.org/doi/10.1073/pnas.2516664123
