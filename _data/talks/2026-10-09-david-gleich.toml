David Gleich is a Professor and University Faculty Scholar in the Computer Science Department at Purdue University whose research is on novel models and fast large-scale algorithms for data-driven scientific computing including scientific data analysis, bioinformatics, and network analysis. He is committed to making software available based on this research. Gleich has received a number of awards for his research including a SIAM Outstanding Publication prize (2018), a Sloan Research Fellowship (2016), an NSF CAREER Award (2011), the John von Neumann post-doctoral fellowship at Sandia National Laboratories in Livermore CA (2009). His research has been funded by the NSF, DOE, DARPA, IARPA, and NASA. He was selected as a Fellow of SIAM in 2025.

