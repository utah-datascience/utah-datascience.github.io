bio = "Daniel Brown is an assistant professor in the School of Computing and Robotics Center at the University of Utah. He completed his postdoc at UC Berkeley in 2023 and he received his Ph.D. in Computer Science from UT Austin in 2020. Daniel’s research focuses on helping robots and other AI systems to safely and efficiently interact with and learn from humans. His research spans the areas of human-robot interaction, reward learning, human-in-the-loop machine learning, and AI safety, with applications in robot manipulation, bio-inspired swarms,autonomous driving,and medical and assistive robotics."

