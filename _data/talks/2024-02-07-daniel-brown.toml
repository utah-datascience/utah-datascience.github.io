abstract = "In this talk I will discuss recent progress and challenges towards using human feedback to develop AI systems that behave in ways that are aligned with human preferences. One problem that arises when robots and other AI systems learn from human input is that there is often a large amount of uncertainty over the human’s true intent and the corresponding desired AI behavior. To address this problem, I will discuss prior and ongoing research along three main topics: (1) Enabling robots and other AI systems to learn models of human preferences in ways that are sample efficient and safe, (2) Reward misidentification and causal confusion when learning from human feedback, and (3) Active learning methods for learning better aligned features and reward functions."

