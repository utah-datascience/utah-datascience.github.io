abstract = """
Graphs are everywhere: social networks, protein interaction networks, citation networks, epidemic spread networks. Applications that use these graphs have progressively become more sophisticated, relying on getting fast and accurate solutions to graph-theoretic problems, many of which are NP-Hard. However, the sizes of today's graphs easily run into millions of vertices and edges, if not more. As a result, many classic algorithms are infeasible for such graphs.

Fortunately, real-world graphs across different domains show a lot of common characteristics such as an abundance of triangles, low average distance between vertices (small-world property), low degeneracy (a measure of the sparsity of edges) etc. which we can leverage to design algorithms that are provably efficient given those parameters. I will demonstrate this in the context of clique counting and decomposition of graphs, which has applications in community detection, spam detection, fraud detection, gene module detection etc. The new algorithms not only massively improve the performance in practice but also improve our theoretical understanding of real-world graphs and help to bridge the gap between theory and practice.
"""

[[speakers]]
