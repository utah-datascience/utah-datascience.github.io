bio = "Shweta Jain is a Computing Innovation Fellow (CIFellow) at the University of Utah working with Prof. Blair D. Sullivan. She was previously a postdoc at the University of Illinois, Urbana-Champaign and prior to that she completed her Ph.D. in Computer Science at the University of California, Santa Cruz (UCSC), advised by Prof. Seshadhri Comandur. Her research interests are in graph mining, parameterized algorithms, randomized and approximation algorithms, and algorithms for massive data and the goal of her research is to use these tools to design algorithms that work well in practice and have provable guarantees. Her work has been recognized by two Best Paper Awards, the SIGKDD Best Dissertation Runner-Up Award 2021, and the Best Dissertation Award 2020 of the Computer Science Department at UCSC. She was also chosen as a Rising Star of EECS 2020."

