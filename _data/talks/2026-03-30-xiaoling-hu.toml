abstract = """
The widespread deployment of AI in medicine demands not only predictive accuracy but also structural awareness, reliability under uncertainty, and interpretability for clinical trust. In this talk, I will present a unified research agenda toward principled learning for medical AI, grounded in these core pillars.

First, I will discuss how incorporating explicit structure, such as topology and spatial priors, into neural networks enhances the model's ability to reason about fine-grained anatomical and pathological features, which are critical for tasks like brain and tumor segmentation. Second, I will focus on reliability, exploring how we can quantify and mitigate uncertainty arising from imperfect labels, limited data, and domain shifts, using methods such as distributional modeling, hyperparameter learning, and probabilistic inference. Third, I will show how these approaches naturally support interpretability, enabling AI systems to communicate meaningful representations that align with human clinical understanding.

Through applications in radiology, pathology, neuroimaging, and large-scale population datasets, I will demonstrate how these principles facilitate scalable annotation, robust generalization, and scientific discovery. I will conclude with future directions aimed at generalizing these principles to multimodal learning, real-world deployment, and next-generation AI systems in medicine.
"""

