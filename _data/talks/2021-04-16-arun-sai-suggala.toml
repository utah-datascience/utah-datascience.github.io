bio = "Arun Sai Suggala is a final year Machine Learning PhD student at Carnegie Mellon University (CMU), advised by Pradeep Ravikumar. Arun is broadly interested in online learning, game theory, and their applications to machine learning and statistics. He is particularly interested in designing new algorithmic and analytic tools in game theory for solving statistical and machine learning problems. His work has received the best student paper award at ALT'20. Prior to CMU, Arun completed his undergraduate studies in Computer Science and Engineering in the Indian Institute of Technology, Bombay."

