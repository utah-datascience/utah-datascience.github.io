tags = ["health & medicine", "statistics"]
abstract = """
Data science is often presented as a straightforward, linear process involving statistical and computational techniques, without addressing the complexities inherent in real-world applications. In contrast, our new book,
"Veridical Data Science: The Practice of Responsible Data Analysis and Decision Making", teaches data scientists to navigate the reality that most projects involve answering ambiguous domain questions with messy data, all while managing a complex web of human judgment calls. We emphasize that datasets are merely approximations of reality, and analyses are shaped by human interpretation. Using the Predictability, Computability, and Stability (PCS) framework to assess the trustworthiness and relevance of data-driven results, "Veridical Data Science" provides an actionable guide for conducting responsible and trustworthy data science.
"""

