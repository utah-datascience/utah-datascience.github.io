bio = "Dr. Rebecca Barter is a Research Assistant Professor in the Division of Epidemiology at the University of Utah. As a statistician, data scientist, and educator, Dr Barter specializes in data science education and the analysis of complex healthcare data. Originally from Australia, Dr. Barter earned her PhD in Statistics from the University of California, Berkeley, in 2019, where she co-authored the book Veridical Data Science: The Practice of Responsible Data Analysis and Decision Making with her advisor, Professor Bin Yu. In addition to her academic work, Dr. Barter shares data science resources and insights on her blog, www.rebeccabarter.com (http://www.rebeccabarter.com/)."

