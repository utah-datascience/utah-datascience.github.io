abstract = "Artificial intelligence is increasingly transforming education, reshaping how students engage with learning and how instructors design and deliver instruction. However, critical gaps remain in the field of AI in Education (AIED): (1) a frequent lack of grounding in the cognitive and learning sciences when developing AI pedagogical tools, (2) a \"black box\" regarding how students process and interact with AI-supported environments, and (3) a limited emphasis on meaningful human involvement in how AI is applied in practice. This talk presents a series of research projects on AI-augmented learning and teaching that address these gaps by integrating cognitive science into AI-powered educational technologies, examining human-AI interaction, and centering human agency in their application. Specifically, using teachable agents as an example, it will discuss (1) how pedagogical AI can be designed using theoretically grounded learning principles, (2) how students' learning processes unfold in these environments, and (3) how educators and learners can actively leverage AI to co-create and navigate engaging experiences that enhance learning outcomes. Employing experimental research, learning analytics, and educational data mining, these studies examine the intersection of human cognition and AI-driven learning. By aligning AI with evidence-based pedagogical strategies, this work advances our understanding of how intelligent technologies can foster deeper learning, positive learning experiences, personalized instruction, and adaptive support across diverse educational contexts."

