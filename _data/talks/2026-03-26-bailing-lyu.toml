bio = "Dr. Bailing Lyu is an Assistant Professor at Auburn University, specializing in AI-driven educational technologies, learning analytics, and cognitive learning sciences. She earned her Ph.D. in Educational Psychology from Pennsylvania State University and subsequently served as a postdoctoral researcher at the University of Utah, focusing on conversational AI. Her research explores how AI can be designed and applied across both student-facing and instructor-facing contexts. For students, she focuses on designing AI systems that foster cognitive engagement while enhancing interest, motivation, and emotional experiences. In parallel, she investigates how AI can empower instructors to develop instructional and AI-embedded materials, such as generative interactive visuals, that make abstract concepts more concrete, accessible, and engaging. Methodologically, she applies learning analytics, educational data mining, and experimental research to study interactions with these multimodal resources. Her impactful work has contributed to large-scale funded projects, including the $10 million ALTER-Math initiative (supported by the Schmidt, Gates, and Walton Family Foundations) as well as several NSF-funded projects. A highly productive scholar, Dr. Lyu has an extensive publication record with 24 submitted or published journal articles and over 40 conference presentations advancing the future of AI in education."

