bio = "David is the 2023 Grace Hopper Postdoctoral Fellow at Lawrence Berkeley Lab and his research focuses on compact, dynamic, and memory-hierarchy-aware algorithms for large-scale data science. Prior to that, he was a CRA Computing Innovation Postdoctoral Fellow working with Martin Farach-Colton at Rutgers University. He earned his PhD at UMass Amherst working with Andrew McGregor."

