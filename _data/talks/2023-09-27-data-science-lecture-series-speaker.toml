bio = "Parikshit Gopalan (https://parikg.github.io/) is a machine learning researcher at Apple (https://machinelearning.apple.com/). His current interests are in fairness in machine learning, unsupervised learning and algorithms/systems for big data. In the past, he has made important contributions to erasure coding for distributed storage, coding theory and computational complexity. His work has been awarded the 2014 Joint IEEE Communication Society & Information Theory Society Paper Prize, 2013 Microsoft TCN Storage Technical Award and the best paper award for the 2012 USENIX Advanced Technology Conference. In the past, he has been a researcher at VMware, Microsoft Research (Silicon valley and Redmond), a postdoc at the University of Washington and UT Austin, a graduate student at Georgia Tech and an undergraduate at IIT Bombay."

