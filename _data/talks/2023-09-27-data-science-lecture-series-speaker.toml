abstract = "Training a predictor to minimize a loss function fixed in advance is the dominant paradigm in machine learning. However, loss minimization by itself might not guarantee desiderata like fairness and accuracy that one could reasonably expect from a predictor. In contrast, various group-fairness notions have been propsoed that constrain the predictor to share certain statistical properties of the data, even when conditioned on a rich family of subgroups. There is no explicit attempt at loss minimization.In this talk, we will explore some recently discovered connections between loss minimization and notions of multi-group fairness. We will see settings where one can lead to the other, and other settings where this is unlikely."

