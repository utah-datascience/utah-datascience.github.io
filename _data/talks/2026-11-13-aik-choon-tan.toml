abstract = """
Cancer research generates large, complex, and heterogeneous datasets spanning molecular profiles, clinical records, imaging, treatments, and outcomes. My research focuses on developing and applying artificial intelligence and machine learning methods to identify meaningful patterns in these data and translate them into clinical impact. In this presentation, I will highlight some of my research in translational bioinformatics, including biomarker discovery from multi-omics data and its application in early-phase clinical trials, as well as computational approaches for identifying and validating drug combinations. I will also discuss recent efforts to use AI and machine learning to characterize immune-related adverse events, extract these events from longitudinal clinical notes, and monitor treatment-related toxicity in clinical trials. Collectively, this work demonstrates how AI/ML can advance precision oncology and improve the development and delivery of cancer therapies.

Bio:
Aik Choon Tan received his B.Eng. degree in Chemical/Bio-process Engineering from the University of Technology Malaysia, and his Ph.D. degree in Computer Science/Bioinformatics from the University of Glasgow, UK, in 2000 and 2005, respectively. Dr. Tan conducted his post-doctoral research training at the Johns Hopkins University School of Medicine from 2004 to 2009. He was an Assistant Professor at the University of Colorado Anschutz Medical Campus in 2009 and promoted to Associate Professor in 2013. Dr. Tan was recruited to the Moffitt Cancer Center in 2019 as the Vice-Chair of the Department of Biostatistics and Bioinformatics. In 2022, Dr. Tan was appointed as the inaugural Senior Director of Data Science at the Huntsman Cancer Institute, University of Utah. He holds the Jon M. and Karen Huntsman Endowed Chair in Cancer Data Science, Tenured Professor of Oncological Sciences and Biomedical Informatics. His research interests are translational bioinformatics and cancer systems biology, primarily by developing computational and machine learning methods for the analysis and integration of high-throughput cancer "omics" data in understanding and overcoming treatment resistance mechanisms in cancer. His lab acts as "connector" to provide seamless integration of computational and statistical methods in experimental and clinical cancer research. He has published >280 manuscripts, co-edited two bioinformatics and systems biology books, and a H-index of 77 (Google Scholar). Dr. Tan is the President of the MCBIOS society, a Senior Member of the ISCB, and Co-Chair of the Data Science Research Interest Group of the Oncology Research Information Exchange Network (ORIEN).
"""

