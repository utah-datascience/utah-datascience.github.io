bio = """
Dr. He Yin is an Associate Professor in the Department of Geography at Kent State University and Director of the Remote Sensing and Land Science Lab. He earned his PhD in Geography from Humboldt University of Berlin and completed postdoctoral training at the University of Wisconsin–Madison.

His research combines geospatial artificial intelligence (GeoAI), Earth observation, and interdisciplinary methods to monitor landscape change and assess its environmental and societal impacts. He serves as principal investigator on projects supported by NASA, the National Science Foundation, Lawrence Livermore National Laboratory, and the Center for International Forestry Research, and currently advises the United Nations Environment Programme (UNEP) and the United Nations Office for Project Services (UNOPS). His work has received the European Space Agency Earth Observation Excellence Team Award (2025) and the American Association of Geographers Media Achievement Award (2026).
