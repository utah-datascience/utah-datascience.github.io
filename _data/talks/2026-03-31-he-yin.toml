abstract = """
Landscapes around the world are changing rapidly, with important consequences for sustainability, climate resilience, and society. Yet monitoring these changes across regions and scales remains difficult. In this talk, I present a research program that combines multi-sensor Earth observation, geospatial artificial intelligence (GeoAI), and land system science to better understand how land systems are changing, what drives those changes, and why they matter.

I begin by presenting my studies using satellite image time series to map land use change and, in collaboration with environmental scientists and ecologists, to examine its implications for carbon sequestration and biodiversity. These studies also reveal key limitations of conventional remote sensing approaches, including sensor constraints, limited transferability, and scarce training data. I then show how these challenges motivate my more recent work in sensor fusion, physics-informed machine learning, and deep learning with very-high-resolution imagery — applied to problems ranging from irrigation water use and wildfire-invasive species interactions to conflict-induced environmental damage. I conclude by discussing the broader goal of building GeoAI models for environmental monitoring that are informed by physical processes, transferable across contexts, and useful for real-world decision-making.
"""

