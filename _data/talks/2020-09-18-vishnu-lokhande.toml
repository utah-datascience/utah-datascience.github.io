abstract = "In this talk, we will study a mechanism to impose fairness in computer vision models concurrently while training the model and informed by standard fairness measures. While existing fairness based approaches in vision have largely relied on training adversarial modules together with the primary classification/regression task, in an effort to remove the influence of the protected attribute or variable, we will discuss how ideas based on well-known optimization concepts can provide a simpler alternative. In our proposed scheme, imposing fairness just requires specifying the protected attribute and utilizing our optimization routine. We will discuss experiments, that are interpretable, demonstrating that several fairness measures from the literature can be reliably imposed on standard vision tasks. We will also discuss technical analysis on the convergence guarantees of the said optimization routine."

