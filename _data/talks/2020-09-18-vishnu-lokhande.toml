bio = "Vishnu Lokhande is a fourth year PhD student in Computer Sciences at the University of Wisconsin-Madison. He is currently completing his research internship at Microsoft Research in the Interactive Media Group. His research interests include Algorithmic Fairness, Semi-Supervised Learning, Constrained and Stochastic Optimization problems. Prior to his graduate studies, he received his bachelor’s in Electrical Engineering at the Indian Institute of Technology Kanpur."

