abstract = """
This talk is focused on obtaining minmax estimation rates for the "manifold learning" problem. Given N data points hypothesized to be i.i.d (independent and identically distributed) samples of a nice density (from within a reasonable class of densities) on a nice manifold (from within some class of nice manifolds of known intrinsic dimension d), the manifold learning problem boils down to estimating certain statistics of this "ground truth" manifold, such as the first few eigenmodes of the Laplace Beltrami operator on the manifold. The minmax estimation problem further asks: given N such data points, among all estimators of the desired statistics (say, a particular eigenvalue and associated eigenfunctions in a suitable norm), which one achieves the smallest maximum expected risk, and how does this minmax risk scale in N and the intrinsic dimension d of the manifold?

An intuitive but impractical estimator consists in estimating the density from the given samples through a ``kernel density estimation'', and then solving the resulting continuum eigenproblem using a numerical method such as finite elements: this estimator turns out to be minmax optimal in scaling-- namely, the associated expected risk scales like N^{-2/d+4}, and we can show a matching lower bound for the minmax risk, demonstrating that no estimator can do better, in scaling, than this estimator.

Next, we ask: do there exist *practical* estimators that are agnostic to knowledge of the manifold (so we don't have to discretize them in order to compute with finite elements!) that achieve, at least nearly, this minmax scaling of the expected risk? We affirmatively answer this question by showing that, the spectrum of a carefully constructed graph laplacian on a random geometric graph constructed from the given N samples provides an estimator for the eigenvalue and eigenvectors of the Laplace Beltrami operator on the manifold that achieves this minmax rate upto a log factor (to a small power). Both the lower and upper bound estimates in the talk bring in new PDE tools to this statistical question, and that we believe will be more broadly applicable in similar applications.

This talk is based on joint work with Nicolas Garcia Trillos and his PhD student Chenghui Li (U. W. Madison), and builds on prior joint work with Scott N. Armstrong (Courant Institute).
"""

