bio = "Prof. Yu is a Research Assistant Professor in the Department of Physics and Astronomy at the University of Utah. Their research focuses on the intersection of high-energy astrophysics and advanced computational methods. As a member of the IceCube Collaboration and former co-lead of the Reconstruction and Machine Learning working group, they have extensive experience applying machine learning techniques to diverse astrophysical data. Their current work focuses on developing neural network architectures for multi-wavelength analysis."

