{%- comment -%}
Calendar view of the talks. The events come from /talks.json, which is
generated from the same TOML records as the talk pages -- no Google Calendar,
no API key, nothing to keep in sync by hand. Clicking an event opens its page.
{%- endcomment -%}

<link href="{{ '/assets/fullcalendar-4.3.1/packages/core/main.css' | relative_url }}" rel='stylesheet' />
<link href="{{ '/assets/fullcalendar-4.3.1/packages/daygrid/main.css' | relative_url }}" rel='stylesheet' />
<link href="{{ '/assets/fullcalendar-4.3.1/packages/list/main.css' | relative_url }}" rel='stylesheet' />
<script src="{{ '/assets/fullcalendar-4.3.1/packages/core/main.js' | relative_url }}"></script>
<script src="{{ '/assets/fullcalendar-4.3.1/packages/interaction/main.js' | relative_url }}"></script>
<script src="{{ '/assets/fullcalendar-4.3.1/packages/daygrid/main.js' | relative_url }}"></script>
<script src="{{ '/assets/fullcalendar-4.3.1/packages/list/main.js' | relative_url }}"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var calendarEl = document.getElementById('calendar');

        var calendar = new FullCalendar.Calendar(calendarEl, {

            plugins: ['interaction', 'dayGrid', 'list'],

            header: {
                left: 'prev,next, today',
                center: 'title',
                right: 'listWeek8, listYear, dayGridMonth'
            },

            defaultView: 'listWeek8',
            views: {
                listWeek8: {
                    type: 'list',
                    buttonText: '8 weeks',
                    duration: { weeks: 8 },
                    listDayFormat: { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }
                },
                listYear: {
                    type: 'list',
                    buttonText: 'Year',
                    duration: { year: 1 },
                    listDayFormat: { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }
                },
                dayGridMonth: {
                    buttonText: 'Month'
                }
            },

            // Generated by scripts/generate_talks.py from _data/talks/*.toml
            events: '{{ "/talks.json" | relative_url }}',

            eventRender: function (info) {
                var location = info.event.extendedProps.location;
                if (location) {
                    info.el.setAttribute('title', info.event.title + ' - ' + location);
                }
            },

            loading: function (bool) {
                document.getElementById('loading').style.display =
                    bool ? 'block' : 'none';
            }

        });

        calendar.render();
    });

</script>
<style>
    #loading {
        display: none;
    }

    /* a canceled talk stays on the calendar, struck through, so the change is visible */
    .talk-canceled {
        opacity: .65;
        text-decoration: line-through;
    }
</style>

<div id='loading'>loading...</div>
<div id='calendar'></div>
