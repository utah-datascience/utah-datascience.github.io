url: "" # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "" # the subpath of your site, e.g. /blog
title: "Utah Center for Data Science" # the name of your site, e.g. ACME Corp.
encoding: utf-8

# Disable the default primer theme from github-pages
theme: null

collections:
  programs:
    output: false
  members:
    output: false

defaults:
  -
    scope:
      path: ""
    values:
      layout: single
      header:
        background-image: /assets/img/header-background/zion-shorter.jpg
  -
    scope:
      path: ""
      type: posts
    values:
      layout: post

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  # ruby/setup-ruby's bundler-cache installs gems here in CI; without this,
  # Jekyll walks the installed gems as site source and can choke on files
  # inside them (e.g. jekyll's own site_template has an ERB date placeholder
  # that fails Jekyll's front-matter date parser).
  - vendor