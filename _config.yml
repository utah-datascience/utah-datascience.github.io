url: "" # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "" # the subpath of your site, e.g. /blog
title: "Utah Center for Data Science" # the name of your site, e.g. ACME Corp.
encoding: utf-8

# Disable the default primer theme from github-pages
theme: null

# Talk pages are dated in the future by design (that is what "upcoming" means),
# and Jekyll hides future-dated documents unless this is set.
future: true

collections:
  programs:
    output: false
  members:
    output: false
  # One page per talk, generated from _data/talks/*.toml by scripts/generate_talks.py.
  talks:
    output: true

defaults:
  -
    scope:
      path: ""
    values:
      layout: single
      header:
        background-image: /assets/img/header-background/zion-shorter.jpg
  -
    scope:
      path: ""
      type: posts
    values:
      layout: post

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - Makefile
  - scripts
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/